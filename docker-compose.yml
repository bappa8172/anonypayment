services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: anonygateway
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      # Persist SQLite database, balances, and audit logs on the host
      - ./data:/app/data

  # Optional PostgreSQL container if you prefer PostgreSQL over SQLite
  # To enable: set DATABASE_URL=postgres://gateway:dbpassword@postgres:5432/gateway in .env
  # and run: docker compose --profile postgres up -d
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: anonygateway-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gateway_secure_password_2026}
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  pgdata:
